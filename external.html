<!DOCTYPE html>
<html lang="it">
<head>
<script>
  if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
  window.addEventListener('pageshow', function(){ window.scrollTo(0, 0); });
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa Brando — Link Esterno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#0E3A66; --pine-2:#154C82; --stone:#FFFFFF; --stone-2:#E5F0FA;
    --brass:#2E86C1; --brass-light:#8FCBEF; --ink:#122436; --ink-soft:#5A7288;
    --line:rgba(14,58,102,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background:var(--stone); font-family:'Comfortaa', sans-serif; color:var(--ink);
    -webkit-font-smoothing:antialiased; height:100svh; overflow:hidden;
  }
  .app{
    max-width:560px; margin:0 auto; height:100svh; background:var(--stone);
    display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,0.08);
  }
  @media (min-width:600px){
    body{ background: linear-gradient(180deg,#DCD3BC, #C9BE9F 60%, #b9ad8c); padding:28px 0; height:auto; overflow:auto; }
    .app{ border-radius:34px; overflow:hidden; height:calc(100svh - 56px); box-shadow: 0 30px 80px -20px rgba(20,26,20,0.55); }
  }

  header.top{
    background:var(--pine); color:#fff; padding:14px 16px; position:relative; z-index:5;
    flex-shrink:0;
  }
  .back-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .back-link{
    display:flex; align-items:center; gap:6px; color:#fff; text-decoration:none;
    font-weight:600; font-size:13px; opacity:0.92; flex-shrink:0;
  }
  .back-link svg{ width:16px; height:16px; }
  .open-btn{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.24);
    border-radius:999px; padding:7px 12px; color:#fff; text-decoration:none;
    font-family:'Comfortaa'; font-weight:700; font-size:11.5px; flex-shrink:0;
  }
  .open-btn svg{ width:13px; height:13px; }
  .page-title{ margin:12px 0 1px; font-size:17px; font-weight:700; color:#fff; line-height:1.2; }
  .page-sub{ margin:0; font-size:11.5px; color:var(--brass-light); font-weight:600; line-height:1.4; }

  .frame-wrap{ flex:1; position:relative; min-height:0; background:#f4f6f8; }
  iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }

  .loading-overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; background:#f4f6f8; z-index:2; transition:opacity .3s;
  }
  .spinner{
    width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--brass);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-overlay p{ margin:0; font-size:12.5px; color:var(--ink-soft); font-weight:600; }

  .empty-state{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:#f4f6f8; padding:30px; text-align:center; z-index:1;
  }
  .empty-state svg{ width:40px; height:40px; color:var(--ink-soft); }
  .empty-state p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.5; }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="back-row">
      <a class="back-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Guest Guide
      </a>
      <a class="open-btn" id="openBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
        <span id="openLabel">Apri nel browser</span>
      </a>
    </div>
    <p class="page-title" id="pageTitle">Link Esterno</p>
    <p class="page-sub" id="pageSub">Se il contenuto non si carica, aprilo nel browser.</p>
  </header>

  <div class="frame-wrap">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p id="loadingLabel">Caricamento…</p>
    </div>
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <p id="emptyLabel">Nessun link fornito.</p>
    </div>
    <iframe id="extFrame" title="external content"></iframe>
  </div>

</div>

<script>
const TITLES = {
  location:      { it:'La Nostra Posizione', en:'Our Location', de:'Unser Standort', es:'Nuestra Ubicación', hu:'A Mi Helyünk', ro:'Locația Noastră', pl:'Nasza Lokalizacja' },
  supermarkets:  { it:'Supermercati', en:'Supermarkets', de:'Supermärkte', es:'Supermercados', hu:'Szupermarketek', ro:'Supermarketuri', pl:'Supermarkety' },
  tours:         { it:'Tour ed Eventi', en:'Tour & Events', de:'Touren & Events', es:'Tours y Eventos', hu:'Túrák és Események', ro:'Tururi și Evenimente', pl:'Wycieczki i Wydarzenia' },
  eventiLocali:  { it:'Eventi Locali', en:'Local Events', de:'Lokale Veranstaltungen', es:'Eventos Locales', hu:'Helyi Események', ro:'Evenimente Locale', pl:'Wydarzenia Lokalne' },
  eventiZona:    { it:'Eventi in Zona', en:'Local Events', de:'Veranstaltungen vor Ort', es:'Eventos en la Zona', hu:'Helyi Programok', ro:'Evenimente în Zonă', pl:'Wydarzenia w Okolicy' },
  maxguests:     { it:'Numero Massimo Ospiti', en:'Maximum Guests', de:'Maximale Gästezahl', es:'Número Máximo de Huéspedes', hu:'Maximális Vendégszám', ro:'Număr Maxim de Oaspeți', pl:'Maksymalna Liczba Gości' },
  taxi:          { it:'Chiamare un Taxi', en:'Call a Taxi', de:'Ein Taxi Rufen', es:'Llamar a un Taxi', hu:'Taxi Hívása', ro:'Cheamă un Taxi', pl:'Zamów Taksówkę' },
  relax:         { it:'Come Rilassarsi', en:'How to Relax', de:'Entspannungstipps', es:'Cómo Relajarse', hu:'Hogyan Lazíts', ro:'Cum să te Relaxezi', pl:'Jak Się Zrelaksować' },
  gygRome:       { it:'Il Meglio di Roma', en:'The Best of Rome', de:'Das Beste von Rom', es:'Lo Mejor de Roma', hu:'Róma Legjava', ro:'Ce e Mai Bun în Roma', pl:'Najlepsze z Rzymu' },
  gygCoast:      { it:'Latina, Sabaudia e Costa del Circeo', en:'Latina, Sabaudia & Circeo Coast', de:'Latina, Sabaudia & Circeo-Küste', es:'Latina, Sabaudia y Costa del Circeo', hu:'Latina, Sabaudia és a Circeo-part', ro:'Latina, Sabaudia și Coasta Circeo', pl:'Latina, Sabaudia i Wybrzeże Circeo' },
  gygAmalfi:     { it:'Il Meglio della Costiera Amalfitana', en:'The Best of Amalfi Coast', de:'Das Beste der Amalfiküste', es:'Lo Mejor de la Costa Amalfitana', hu:'Amalfi-part Legjava', ro:'Ce e Mai Bun pe Coasta Amalfi', pl:'Najlepsze z Wybrzeża Amalfi' },
  gygPompei:     { it:'Il Meglio di Pompei', en:'The Best of Pompeii', de:'Das Beste von Pompeji', es:'Lo Mejor de Pompeya', hu:'Pompeii Legjava', ro:'Ce e Mai Bun în Pompei', pl:'Najlepsze z Pompei' },
  gygNaples:     { it:'Napoli', en:'Naples', de:'Neapel', es:'Nápoles', hu:'Nápoly', ro:'Napoli', pl:'Neapol' },
  gygFlorence:   { it:'Firenze', en:'Florence', de:'Florenz', es:'Florencia', hu:'Firenze', ro:'Florența', pl:'Florencja' },
  gygOrvieto:    { it:'Orvieto', en:'Orvieto', de:'Orvieto', es:'Orvieto', hu:'Orvieto', ro:'Orvieto', pl:'Orvieto' },
  otherActivities:{ it:'Altre Attività', en:'Other Activities', de:'Weitere Aktivitäten', es:'Otras Actividades', hu:'További Programok', ro:'Alte Activități', pl:'Inne Atrakcje' }
};

const UI = {
  it:{ open:'Apri nel browser', hint:'Se il contenuto non si carica, aprilo nel browser.', loading:'Caricamento…', empty:'Nessun link fornito.' },
  en:{ open:'Open in browser', hint:"If the content doesn't load, open it in your browser.", loading:'Loading…', empty:'No link provided.' },
  de:{ open:'Im Browser öffnen', hint:'Falls der Inhalt nicht lädt, öffne ihn im Browser.', loading:'Wird geladen…', empty:'Kein Link angegeben.' },
  es:{ open:'Abrir en el navegador', hint:'Si el contenido no se carga, ábrelo en el navegador.', loading:'Cargando…', empty:'No se proporcionó ningún enlace.' },
  hu:{ open:'Megnyitás böngészőben', hint:'Ha a tartalom nem töltődik be, nyisd meg böngészőben.', loading:'Betöltés…', empty:'Nincs megadva link.' },
  ro:{ open:'Deschide în browser', hint:'Dacă conținutul nu se încarcă, deschide-l în browser.', loading:'Se încarcă…', empty:'Niciun link furnizat.' },
  pl:{ open:'Otwórz w przeglądarce', hint:'Jeśli treść się nie ładuje, otwórz ją w przeglądarce.', loading:'Ładowanie…', empty:'Nie podano linku.' }
};

const params = new URLSearchParams(window.location.search);
const targetUrl = params.get('url') || '';
const key = params.get('key') || '';
const lang = (localStorage.getItem('vbLang') || 'it');
const ui = UI[lang] || UI.it;

document.getElementById('openLabel').textContent = ui.open;
document.getElementById('pageSub').textContent = ui.hint;
document.getElementById('loadingLabel').textContent = ui.loading;
document.getElementById('emptyLabel').textContent = ui.empty;

let title = 'Link Esterno';
if(TITLES[key]){
  title = TITLES[key][lang] || TITLES[key].it;
} else if(targetUrl){
  try{ title = new URL(targetUrl).hostname.replace('www.',''); }catch(e){}
}
document.getElementById('pageTitle').textContent = title;
document.title = 'Villa Brando — ' + title;

const frame = document.getElementById('extFrame');
const overlay = document.getElementById('loadingOverlay');
const emptyState = document.getElementById('emptyState');
const openBtn = document.getElementById('openBtn');

if(targetUrl){
  openBtn.href = targetUrl;
  frame.src = targetUrl;
  frame.addEventListener('load', function(){
    overlay.style.opacity = '0';
    setTimeout(function(){ overlay.style.display = 'none'; }, 300);
  });
} else {
  overlay.style.display = 'none';
  emptyState.style.display = 'flex';
  openBtn.style.display = 'none';
}

window.scrollTo(0, 0);
</script>

</body>
</html>
