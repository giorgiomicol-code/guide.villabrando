<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa Brando — Numero Massimo Ospiti</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#0E3A66; --pine-2:#154C82; --stone:#FFFFFF; --stone-2:#E5F0FA;
    --paper:#FFFFFF; --brass:#2E86C1; --brass-light:#8FCBEF; --sea:#1F6F9C; --clay:#3E7CB1;
    --ink:#122436; --ink-soft:#5A7288; --line:rgba(14,58,102,0.12);
    --shadow: 0 10px 30px -14px rgba(14,58,102,0.30); --radius: 18px;
    --warn:#B3261E; --warn-bg:#FDECEA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--stone); font-family:'Comfortaa', sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100svh; }
  h1,h2,h3{ font-family:'Comfortaa', sans-serif; font-weight:500; letter-spacing:-0.01em; }
  .app{ max-width:560px; margin:0 auto; min-height:100svh; background:var(--stone); display:flex; flex-direction:column; }
  @media (min-width:600px){
    body{ background: linear-gradient(180deg,#DCE8F5, #C7DCF0 60%, #b7d0ea); padding:28px 0; }
    .app{ border-radius:34px; overflow:hidden; min-height:calc(100svh - 56px); box-shadow: 0 30px 80px -20px rgba(14,58,102,0.35); }
  }

  header.top{
    position:relative; overflow:hidden; color:#fff; padding:18px 20px 30px;
    min-height:210px; display:flex; flex-direction:column; justify-content:space-between;
    background: linear-gradient(150deg, #050B1A 0%, #0E2A52 45%, #1B1650 100%);
    background-size:cover; background-position:center;
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:2; }
  .back-link{ display:flex; align-items:center; gap:6px; color:#fff; text-decoration:none; font-size:13px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,0.5); }
  .back-link svg{ width:16px; height:16px; }
  .lang-select{ position:relative; flex-shrink:0; z-index:20; }
  .lang-current{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22);
    border-radius:999px; padding:8px 12px; color:#fff; font-family:'Comfortaa'; font-weight:700; font-size:12px; cursor:pointer; backdrop-filter:blur(4px);
  }
  .lang-current svg{ width:13px; height:13px; transition:transform .2s; }
  .lang-current.open svg{ transform:rotate(180deg); }
  .lang-menu{
    position:fixed; background:#fff; border-radius:14px;
    box-shadow:0 14px 34px -10px rgba(14,58,102,0.4); border:1px solid var(--line);
    padding:6px; display:none; min-width:160px; max-height:70vh; overflow-y:auto;
    z-index:999;
  }
  .lang-menu.open{ display:block; }
  .lang-menu button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none;
    padding:9px 10px; border-radius:9px; font-family:'Comfortaa'; font-weight:600; font-size:13px;
    color:var(--ink); cursor:pointer;
  }
  .lang-menu button:hover{ background:var(--stone-2); }
  .lang-menu button.active{ background:#4FD8FF; color:#04263f; }
  .lang-menu button .code{
    width:24px; height:18px; border-radius:4px; background:var(--stone-2); color:var(--sea);
    font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .lang-menu button.active .code{ background:rgba(4,38,63,0.15); color:#04263f; }
  h1.page-title{ margin:0; font-size:24px; color:#fff; position:relative; z-index:2; text-shadow:0 2px 14px rgba(0,0,0,0.5); }
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8FE3FF; font-weight:700; margin-bottom:4px; display:block; position:relative; z-index:2; text-shadow:0 1px 6px rgba(0,0,0,0.5); }
  .header-bottom{ position:relative; z-index:2; }

  main{ flex:1; padding:22px 20px 40px; }
  .intro-text{ background:var(--stone-2); border-radius:var(--radius); padding:18px 20px; font-size:14.5px; line-height:1.6; color:var(--ink); margin-bottom:22px; }
  .intro-text b{ color:var(--pine); }

  .section-header{ display:flex; align-items:center; gap:8px; margin:26px 0 14px; }
  .section-header:first-of-type{ margin-top:0; }
  .section-header .dot{ width:7px; height:7px; border-radius:50%; background:var(--brass); flex-shrink:0; }
  .section-header .label{ font-size:12px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--sea); }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:20px; }
  .card + .card{ margin-top:12px; }
  .ic{
    width:50px; height:50px; border-radius:15px; flex-shrink:0; color:#fff;
    background:linear-gradient(160deg, var(--pine) 0%, #0A2A4A 100%);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px -8px rgba(14,58,102,0.5);
  }
  .ic svg{ width:24px; height:24px; }
  .photo{ display:block; width:100%; border-radius:20px; box-shadow:var(--shadow); }

  .note-box{
    margin-top:22px; background:var(--stone-2); border-radius:14px; padding:14px 16px;
    font-size:12px; color:var(--ink-soft); line-height:1.55; display:flex; gap:10px; align-items:flex-start;
  }
  .note-box svg{ width:17px; height:17px; color:var(--sea); flex-shrink:0; margin-top:1px; }

  .occ-card{ display:flex; align-items:center; gap:16px; }
  .occ-card .txt{ flex:1; font-size:14px; font-weight:600; line-height:1.5; color:var(--ink); }
  .occ-num{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:92px; padding:12px 8px;
    border-radius:16px; background:linear-gradient(160deg, var(--pine) 0%, #0A2A4A 100%); color:#fff; box-shadow:0 8px 18px -8px rgba(14,58,102,0.5); }
  .occ-num .n{ font-size:40px; font-weight:700; line-height:1; }
  .occ-num .u{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-top:6px; opacity:.85; }
  .ban-card{ display:flex; align-items:center; gap:14px; background:var(--warn-bg); border:1px solid rgba(179,38,30,0.18); margin-top:14px; }
  .ban-card .ic{ background:linear-gradient(160deg,#D93A30 0%, #8E1C15 100%); box-shadow:0 8px 18px -8px rgba(179,38,30,0.5); }
  .ban-card .title{ font-size:14.5px; font-weight:700; color:var(--warn); line-height:1.4; }

  footer.brand{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px 22px; color:var(--ink-soft); font-size:12px;
  }
  .footer-back{ display:flex; align-items:center; gap:6px; color:var(--pine); text-decoration:none; font-weight:700; font-size:12.5px; }
  .footer-back svg{ width:15px; height:15px; }
</style>
</head>

let LANG = 'it';
try { LANG = localStorage.getItem('vbLang') || 'it'; } catch(e) {}
if (!I18N[LANG]) LANG = 'it';

const LANG_LABELS = { it:'IT', en:'EN', fr:'FR', de:'DE', es:'ES', hu:'HU', ro:'RO', pl:'PL' };

function toggleLangMenu(){
  const menu = document.getElementById('langMenu');
  const btn = document.getElementById('langCurrentBtn');
  const isOpen = menu.classList.contains('open');
  if(!isOpen){
    if(menu.parentElement !== document.body){ document.body.appendChild(menu); }
    const rect = btn.getBoundingClientRect();
    menu.style.top = (rect.bottom + 8) + 'px';
    const rightEdge = window.innerWidth - rect.right;
    menu.style.right = rightEdge + 'px';
    menu.style.left = 'auto';
  }
  menu.classList.toggle('open');
  btn.classList.toggle('open');
}

document.addEventListener('click', function(e){
  const sel = document.getElementById('langSelect');
  const menu = document.getElementById('langMenu');
  const clickedInsideSelect = sel && sel.contains(e.target);
  const clickedInsideMenu = menu && menu.contains(e.target);
  if(!clickedInsideSelect && !clickedInsideMenu){
    document.getElementById('langMenu').classList.remove('open');
    document.getElementById('langCurrentBtn').classList.remove('open');
  }
});

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(elm=>{
    const key = elm.getAttribute('data-i18n');
    if(I18N[LANG][key]) elm.innerHTML = I18N[LANG][key];
  });
  document.documentElement.lang = LANG;
  document.title = 'Villa Brando — ' + I18N[LANG].title;
  document.getElementById('langCurrentLabel').textContent = LANG_LABELS[LANG];
  document.querySelectorAll('.lang-menu button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === LANG);
  });
}

function setLang(l){
  try { localStorage.setItem('vbLang', l); } catch(e) {}
  LANG = l;
  document.getElementById('langMenu').classList.remove('open');
  document.getElementById('langCurrentBtn').classList.remove('open');
  applyI18n();
}
