<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa Brando — Come Usare Correttamente la Serratura Smart della Porta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#0E3A66;
    --pine-2:#154C82;
    --stone:#FFFFFF;
    --stone-2:#E5F0FA;
    --brass:#2E86C1;
    --brass-light:#8FCBEF;
    --ink:#122436;
    --ink-soft:#5A7288;
    --line:rgba(14,58,102,0.12);
    --shadow: 0 10px 30px -14px rgba(14,58,102,0.30);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--stone);
    font-family:'Comfortaa', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
  }
  .app{
    max-width:520px; margin:0 auto; min-height:100svh;
    background:var(--stone); position:relative;
    display:flex; flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,0.08);
  }
  @media (min-width:560px){
    body{ background: linear-gradient(180deg,#DCD3BC, #C9BE9F 60%, #b9ad8c); padding:28px 0; }
    .app{ border-radius:34px; overflow:hidden; min-height:calc(100svh - 56px); box-shadow: 0 30px 80px -20px rgba(20,26,20,0.55); }
  }

  header.top{
    background:var(--pine); color:#fff; padding:18px 20px 20px; position:relative;
  }
  header.top::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(143,203,239,0.35), transparent 55%),
      radial-gradient(90% 90% at 0% 100%, rgba(14,58,102,0.35), transparent 55%);
    pointer-events:none;
  }
  .back-row{ position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .back-link{
    display:flex; align-items:center; gap:6px; color:#fff; text-decoration:none;
    font-weight:600; font-size:13px; opacity:0.9;
  }
  .back-link svg{ width:16px; height:16px; }
  h1.page-title{
    position:relative; z-index:1; margin:14px 0 2px; font-size:22px; font-weight:500; color:#fff; line-height:1.15;
  }
  .page-sub{ position:relative; z-index:1; margin:0; font-size:12.5px; color:var(--brass-light); font-weight:600; letter-spacing:0.02em; }

  .lang-select{ position:relative; z-index:20; flex-shrink:0; }
  .lang-current{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22);
    border-radius:999px; padding:8px 12px; color:#fff; font-family:'Comfortaa'; font-weight:700; font-size:12px; cursor:pointer;
  }
  .lang-current svg{ width:13px; height:13px; transition:transform .2s; }
  .lang-current.open svg{ transform:rotate(180deg); }
  .lang-menu{
    position:fixed; background:#fff; border-radius:14px;
    box-shadow:0 14px 34px -10px rgba(14,58,102,0.4); border:1px solid var(--line);
    padding:6px; display:none; min-width:160px; max-height:70vh; overflow-y:auto;
    z-index:999;
  }
  .lang-menu.open{ display:block; }
  .lang-menu button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none;
    padding:9px 10px; border-radius:9px; font-family:'Comfortaa'; font-weight:600; font-size:13px;
    color:var(--ink); cursor:pointer;
  }
  .lang-menu button:hover{ background:var(--stone-2); }
  .lang-menu button.active{ background:var(--brass); color:#0A2540; }
  .lang-menu button .code{
    width:24px; height:18px; border-radius:4px; background:var(--stone-2); color:var(--pine);
    font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .lang-menu button.active .code{ background:rgba(10,37,64,0.15); color:#0A2540; }

  main{ flex:1; padding:18px 16px 28px; }

  .img-lang-note{
    display:flex; align-items:center; gap:6px; background:var(--stone-2); color:var(--pine);
    font-size:12px; font-weight:600; padding:9px 12px; border-radius:12px; margin-bottom:14px;
  }
  .img-lang-note svg{ width:14px; height:14px; flex-shrink:0; }

  .infographic-wrap{
    display:flex; flex-direction:column; gap:18px;
    margin-bottom:20px;
  }
  .infographic-wrap img{
    display:none; width:100%; height:auto;
    border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .lock-photo.active{ display:block; }

  .section-block{ margin-bottom:18px; }
  .section-header{
    display:inline-block; background:var(--pine); color:#fff; font-weight:700; font-size:13px;
    padding:8px 16px; border-radius:999px; margin-bottom:10px;
  }
  .section-header.alt{ background:var(--brass); color:#0A2540; }
  .step-card{
    display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .step-card:last-child{ border-bottom:none; }
  .step-num{
    flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--pine); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
  }
  .step-body .step-title{ margin:0 0 2px; font-weight:700; font-size:14.5px; color:var(--ink); }
  .step-body .step-sub{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.45; }

  .handle-box{
    display:flex; gap:12px; align-items:center; background:var(--pine); border-radius:14px;
    padding:14px 16px; margin-bottom:14px;
  }
  .handle-icon{
    flex-shrink:0; width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.14);
    display:flex; align-items:center; justify-content:center;
  }
  .handle-icon svg{ width:20px; height:20px; color:var(--brass-light); }
  .handle-title{ margin:0 0 2px; font-weight:700; font-size:12.5px; color:#fff; letter-spacing:0.03em; text-transform:uppercase; }
  .handle-text{ margin:0; font-size:12.5px; color:rgba(255,255,255,0.85); line-height:1.5; }

  .important-box{
    display:flex; gap:10px; background:#FFF6E5; border:1px solid #F0C878; border-radius:14px;
    padding:12px 14px; margin-top:6px;
  }
  .important-box svg{ width:20px; height:20px; flex-shrink:0; color:#B8791A; }
  .important-box p{ margin:0; font-size:12.5px; color:#6b5228; line-height:1.5; }
  .important-box b{ color:#8a5c10; }

  footer.contact-bar{
    background:var(--stone-2); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .contact-bar .brandline{ font-size:13px; font-weight:700; color:var(--pine); }
  .contact-bar .brandline small{ display:block; font-weight:500; color:var(--ink-soft); font-size:11px; }
  .contact-bar a.phone{
    display:flex; align-items:center; gap:8px; background:var(--pine); color:#fff; text-decoration:none;
    padding:9px 14px; border-radius:999px; font-weight:700; font-size:12.5px;
  }
  .contact-bar a.phone svg{ width:14px; height:14px; }
</style>
</head>

function stepCardHTML(num, step){
  return '<div class="step-card"><div class="step-num">' + num + '</div>' +
    '<div class="step-body"><p class="step-title">' + step.t + '</p><p class="step-sub">' + step.s + '</p></div></div>';
}

function renderSteps(lang){
  const d = I18N[lang];
  let html = '';
  html += '<div class="section-block">';
  html += '<span class="section-header">' + d.closingHeader + '</span>';
  d.closingSteps.forEach(function(s,i){ html += stepCardHTML(i+1, s); });
  html += '</div>';
  html += '<div class="section-block">';
  html += '<span class="section-header alt">' + d.openingHeader + '</span>';
  d.openingSteps.forEach(function(s,i){ html += stepCardHTML(i+1, s); });
  html += '</div>';
  html += '<div class="handle-box"><div class="handle-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10a2 2 0 0 1 2-2h5"/><circle cx="16" cy="8" r="4"/></svg></div><div><p class="handle-title">' + d.handleHeader + '</p><p class="handle-text">' + d.handleText + '</p></div></div>';
  html += '<div class="important-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><p>' + d.important + '</p></div>';
  document.getElementById('stepsContent').innerHTML = html;
}

const menu = document.getElementById('langMenu');
const btn = document.getElementById('langCurrentBtn');

function toggleLangMenu(){
  const isOpen = menu.classList.contains('open');
  if(!isOpen){
    if(menu.parentElement !== document.body){ document.body.appendChild(menu); }
    const rect = btn.getBoundingClientRect();
    menu.style.top = (rect.bottom + 8) + 'px';
    const rightEdge = window.innerWidth - rect.right;
    menu.style.right = rightEdge + 'px';
    menu.style.left = 'auto';
  }
  menu.classList.toggle('open');
  btn.classList.toggle('open');
}

document.addEventListener('click', function(e){
  const sel = document.getElementById('langSelect');
  const clickedInsideSelect = sel && sel.contains(e.target);
  const clickedInsideMenu = menu && menu.contains(e.target);
  if(!clickedInsideSelect && !clickedInsideMenu){
    menu.classList.remove('open');
    btn.classList.remove('open');
  }
});

function setLang(lang){
  const d = I18N[lang];
  localStorage.setItem('vbLang', lang);
  document.getElementById('langCurrentLabel').textContent = LANG_LABELS[lang];
  document.querySelectorAll('.lang-menu button').forEach(function(b){
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  menu.classList.remove('open');
  btn.classList.remove('open');

  document.getElementById('pageTitle').textContent = d.title;
  document.getElementById('pageSub').textContent = d.sub;
  document.getElementById('imgLangNoteText').textContent = d.imgNote;

  document.getElementById('photoIt').classList.toggle('active', lang === 'it');
  document.getElementById('photoEn').classList.toggle('active', lang !== 'it');

  renderSteps(lang);
  document.documentElement.lang = lang;
}

setLang(localStorage.getItem('vbLang') || 'it');
